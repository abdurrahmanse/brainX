[project]
name = "brainx-model"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.5",
    "psutil==7.2.2",
    "torch==2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
